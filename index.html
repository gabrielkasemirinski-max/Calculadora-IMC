<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <form id="imcForm">
        <div>
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" required>
        </div>

        <div>
            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" required>
        </div>

        <button type="submit">Calcular</button>
    </form>

    <div id="resultado">
        <p>Seu IMC: <span id="valorImc">-</span></p>
        <p>Classificação: <span id="classificacaoImc">-</span></p>
    </div>

    <script>
        document.getElementById('imcForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            
            if (peso > 0 && altura > 0) {
                const imc = (peso / (altura * altura)).toFixed(2);
                let classificacao = '';
                
                if (imc < 18.5) {
                    classificacao = 'Abaixo do peso';
                } else if (imc < 25) {
                    classificacao = 'Peso normal';
                } else if (imc < 30) {
                    classificacao = 'Sobrepeso';
                } else {
                    classificacao = 'Obesidade';
                }
                
                document.getElementById('valorImc').textContent = imc;
                document.getElementById('classificacaoImc').textContent = classificacao;
            }
        });
    </script>

</body>
</html>
